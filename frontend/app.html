// ── Canvas AI Avatar (animated lip-sync news anchor) ──
function CanvasAvatar({speaking}) {
  const canvasRef=React.useRef(null);
  const stRef=React.useRef({t:0,bP:0,bT:0,lastB:0});
  const rafRef=React.useRef(null);
  const spkRef=React.useRef(speaking);
  React.useEffect(()=>{spkRef.current=speaking;},[speaking]);
  React.useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const S=stRef.current;
    function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
    const draw=()=>{
      S.t++;const spk=spkRef.current;
      ctx.clearRect(0,0,140,200);
      if(spk){const g=ctx.createRadialGradient(70,90,10,70,90,85);g.addColorStop(0,'rgba(6,182,212,.18)');g.addColorStop(1,'rgba(6,182,212,0)');ctx.fillStyle=g;ctx.fillRect(0,0,140,200);}
      // Body
      ctx.fillStyle='#172d45';ctx.beginPath();ctx.moveTo(10,200);ctx.lineTo(10,158);ctx.quadraticCurveTo(70,146,130,158);ctx.lineTo(130,200);ctx.fill();
      // Shirt
      ctx.fillStyle='#f0f4ff';ctx.beginPath();ctx.moveTo(55,142);ctx.lineTo(70,178);ctx.lineTo(85,142);ctx.fill();
      // Tie
      ctx.fillStyle='#1d4ed8';ctx.beginPath();ctx.moveTo(65,146);ctx.lineTo(70,182);ctx.lineTo(75,146);ctx.fill();
      // Neck
      ctx.fillStyle='#c07040';ctx.fillRect(62,130,16,16);
      // Head bob
      const hy=spk?Math.sin(S.t*.06)*1.5:0;
      // Head
      ctx.fillStyle='#c87942';ctx.beginPath();ctx.ellipse(70,88+hy,37,44,0,0,Math.PI*2);ctx.fill();
      // Jaw shadow
      ctx.fillStyle='rgba(0,0,0,.07)';ctx.beginPath();ctx.ellipse(70,112+hy,28,18,0,0,Math.PI);ctx.fill();
      // Hair
      ctx.fillStyle='#1a0f0a';ctx.beginPath();ctx.ellipse(70,54+hy,38,24,0,Math.PI,0,true);ctx.fill();
      ctx.beginPath();ctx.ellipse(35,76+hy,7,20,-0.1,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(105,76+hy,7,20,0.1,0,Math.PI*2);ctx.fill();
      // Ears
      ctx.fillStyle='#b07038';ctx.beginPath();ctx.ellipse(33,90+hy,6,11,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(107,90+hy,6,11,0,0,Math.PI*2);ctx.fill();
      // Eyebrows
      ctx.strokeStyle='#1a0f0a';ctx.lineWidth=2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(48,74+hy);ctx.quadraticCurveTo(57,70+hy,66,74+hy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(74,74+hy);ctx.quadraticCurveTo(83,70+hy,92,74+hy);ctx.stroke();
      // Blink logic
      if(S.t-S.lastB>160+Math.random()*60){S.lastB=S.t;S.bP=1;S.bT=0;}
      if(S.bP===1){S.bT+=.28;if(S.bT>=1){S.bP=2;S.bT=0;}}else if(S.bP===2){S.bT+=.5;if(S.bT>=1){S.bP=3;S.bT=0;}}else if(S.bP===3){S.bT+=.28;if(S.bT>=1){S.bP=0;S.bT=0;}}
      const eyH=S.bP===2?0:S.bP===1?(1-S.bT)*6:S.bP===3?S.bT*6:6;
      if(eyH>0.5){
        ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(56,86+hy,9,eyH,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(84,86+hy,9,eyH,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1a0a05';ctx.beginPath();ctx.arc(56,86+hy,5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(84,86+hy,5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.62)';ctx.beginPath();ctx.arc(58,84+hy,2,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(86,84+hy,2,0,Math.PI*2);ctx.fill();
      }else{
        ctx.strokeStyle='#2c1810';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(47,86+hy);ctx.quadraticCurveTo(56,90+hy,65,86+hy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(75,86+hy);ctx.quadraticCurveTo(84,90+hy,93,86+hy);ctx.stroke();
      }
      // Nose
      ctx.strokeStyle='rgba(130,75,35,.45)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(70,94+hy);ctx.lineTo(66,106+hy);ctx.quadraticCurveTo(70,109+hy,74,106+hy);ctx.stroke();
      // Mouth lip-sync
      const mo=spk?Math.abs(Math.sin(S.t*.22))*10+1:0;
      const ly=114+hy;
      ctx.fillStyle='#7a3810';
      ctx.beginPath();ctx.moveTo(54,ly);ctx.quadraticCurveTo(70,ly-2,86,ly);ctx.quadraticCurveTo(70,ly+mo+5,54,ly);ctx.fill();
      if(mo>3){
        ctx.fillStyle='#2d0808';ctx.beginPath();ctx.moveTo(56,ly+1);ctx.quadraticCurveTo(70,ly+mo,84,ly+1);ctx.quadraticCurveTo(70,ly+mo*.4,56,ly+1);ctx.fill();
        ctx.fillStyle='#fffde7';ctx.beginPath();ctx.moveTo(58,ly+2);ctx.lineTo(82,ly+2);ctx.quadraticCurveTo(82,ly+mo*.45,70,ly+mo*.5);ctx.quadraticCurveTo(58,ly+mo*.45,58,ly+2);ctx.fill();
      }
      // Microphone
      ctx.fillStyle='#0d2030';rr(62,172,16,24,5);ctx.fill();
      ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(70,172,10,Math.PI,0);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(63,172,4,22);
      rafRef.current=requestAnimationFrame(draw);
    };
    rafRef.current=requestAnimationFrame(draw);
    return()=>cancelAnimationFrame(rafRef.current);
  },[]);
  return <canvas ref={canvasRef} width={140} height={200} style={{filter:'drop-shadow(0 4px 24px rgba(59,130,246,.4))',borderRadius:8}}/>;
}

// ── Broadcast Studio ──
const TTS_VOICES = {
  hi:'hi-IN',ta:'ta-IN',te:'te-IN',bn:'bn-IN',mr:'mr-IN',gu:'gu-IN',
  kn:'kn-IN',ml:'ml-IN',pa:'pa-IN',or:'or-IN',fr:'fr-FR',es:'es-ES',ar:'ar-SA',en:'en-US'
};
const RV_VOICES = {
  hi:'Hindi Female',ta:'Tamil Female',te:'Telugu Female',bn:'Bengali Female',
  mr:'Marathi Female',gu:'Gujarati Female',kn:'Kannada Female',ml:'Malayalam Female',
  pa:'Punjabi Female',fr:'French Female',es:'Spanish Female',ar:'Arabic Female',en:'UK English Female'
};
const LANG_NAMES2 = {
  hi:'Hindi',ta:'Tamil',te:'Telugu',bn:'Bengali',mr:'Marathi',gu:'Gujarati',
  kn:'Kannada',ml:'Malayalam',pa:'Punjabi',or:'Odia',fr:'French',es:'Spanish',ar:'Arabic',en:'English'
};

function Broadcast({articles,toast}) {
  const [selArticle,setSelArticle]=useState(null);
  const [selLang,setSelLang]=useState('en');
  const [speaking,setSpeaking]=useState(false);
  const [formats,setFormats]=useState(null);
  const [fmtLoading,setFmtLoading]=useState(false);
  const [readiness,setReadiness]=useState(null);
  const [scriptText,setScriptText]=useState('');
  const pubArticles=(articles||[]).filter(a=>a.status==='published'||a.status==='approved');

  const getContent=()=>{
    if(!selArticle)return{title:'',text:''};
    if(selLang==='en')return{title:selArticle.title,text:selArticle.content};
    const t=(selArticle.translations||[]).find(tr=>tr.language_code===selLang);
    return t?{title:t.translated_title,text:t.translated_content}:{title:selArticle.title,text:selArticle.content};
  };

  const voicesRef=React.useRef([]);
  const [activeVoice,setActiveVoice]=useState('');
  React.useEffect(()=>{
    const load=()=>{const v=window.speechSynthesis.getVoices();if(v.length>0)voicesRef.current=v;};
    load();
    window.speechSynthesis.onvoiceschanged=load;
    return()=>{if(window.speechSynthesis.onvoiceschanged===load)window.speechSynthesis.onvoiceschanged=null;};
  },[]);

  const speakNow=async()=>{
    window.speechSynthesis.cancel();
    if(window.responsiveVoice)window.responsiveVoice.cancel();

    // Step 1: get translated content — auto-fetch if this article has no translation for selLang
    const hasTranslation=selArticle?.translations?.find(x=>x.language_code===selLang);
    let full;
    if(formats?.teleprompter_script){
      full=formats.teleprompter_script;
    } else if(selLang!=='en' && !hasTranslation && selArticle){
      setActiveVoice('Fetching '+LANG_NAMES2[selLang]+' content...');
      setSpeaking(true);
      try{
        const r=await api('GET',`/api/articles/${selArticle.id}/multi-format?language_code=${selLang}`);
        setFormats(r.formats);
        full=r.formats?.teleprompter_script;
        if(full)setScriptText(full);
      }catch(e){}
      setSpeaking(false);
    }
    if(!full){const {title,text}=getContent();full=title+'. '+text;}
    setScriptText(full);

    // Step 2: speak — Web Speech API first (instant, local), ResponsiveVoice as fallback
    const langCode=TTS_VOICES[selLang]||'en-US';
    const lp=langCode.split('-')[0];
    const doSpeak=(voices)=>{
      const utt=new SpeechSynthesisUtterance(full);
      utt.lang=langCode; utt.rate=0.9; utt.pitch=1; utt.volume=1;
      const match=voices.find(v=>v.lang===langCode)||voices.find(v=>v.lang.startsWith(lp));
      if(match){utt.voice=match;setActiveVoice(match.name+' ('+match.lang+')');}
      else{setActiveVoice('System ('+langCode+')');}
      setSpeaking(true);
      utt.onend=()=>setSpeaking(false);
      utt.onerror=()=>{
        // WSA failed — try ResponsiveVoice
        if(window.responsiveVoice&&RV_VOICES[selLang]){
          setActiveVoice(RV_VOICES[selLang]);
          window.responsiveVoice.speak(full,RV_VOICES[selLang],
            {rate:0.9,pitch:1,volume:1,onend:()=>setSpeaking(false),onerror:()=>setSpeaking(false)});
        } else { setSpeaking(false); }
      };
      window.speechSynthesis.speak(utt);
    };
    const cached=voicesRef.current;
    if(cached.length>0){doSpeak(cached);}
    else{
      const t=Date.now();
      const poll=setInterval(()=>{
        const v=window.speechSynthesis.getVoices();
        if(v.length>0||Date.now()-t>800){clearInterval(poll);voicesRef.current=v;doSpeak(v);}
      },80);
    }
  };
  const stopSpeech=()=>{
    window.speechSynthesis.cancel();
    if(window.responsiveVoice)window.responsiveVoice.cancel();
    setSpeaking(false);setActiveVoice('');
  };

  const loadFormats=async()=>{
    if(!selArticle)return;
    setFmtLoading(true);
    try{
      const r=await api('GET',`/api/articles/${selArticle.id}/multi-format?language_code=${selLang}`);
      setFormats(r.formats);
      if(r.formats.teleprompter_script)setScriptText(r.formats.teleprompter_script);
      toast('success','Formats Ready','All broadcast formats generated.');
    }catch(e){toast('error','Failed',e.message);}
    setFmtLoading(false);
  };

  const loadReadiness=async()=>{
    if(!selArticle)return;
    try{const r=await api('GET',`/api/articles/${selArticle.id}/readiness`);setReadiness(r.readiness);}
    catch(e){}
  };

  const onSelectArticle=a=>{setSelArticle(a);setSelLang('en');setFormats(null);setReadiness(null);setScriptText(a.content||'');stopSpeech();};
  const {title:currTitle}=getContent();
  const avLangs=[{code:'en',name:'English'},...(selArticle?.translations||[]).map(t=>({code:t.language_code,name:t.language_name}))];
  const rCircle=32;const circ=2*Math.PI*rCircle;const pct=readiness?readiness.score/100:0;
  const RCOL={green:'var(--green)',yellow:'var(--yellow)',orange:'var(--orange)',red:'var(--red)'};

  return (
    <div>
      <div style={{marginBottom:16}}>
        <h1 style={{fontSize:19,fontWeight:700,marginBottom:3}}>📺 Broadcast Studio</h1>
        <p style={{fontSize:12,color:'var(--text-muted)'}}>AI News Presenter with multilingual voice broadcast and multi-format publishing</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:16,alignItems:'start'}}>
        {/* Article selector */}
        <div className="card" style={{padding:12}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:9}}>Select Article</div>
          {pubArticles.length===0?(
            <div className="empty"><div className="empty-ico">📺</div><p>Approve or publish articles first.</p></div>
          ):(

function Analytics({stats,articles}) {
  const langCount={};(articles||[]).forEach(a=>(a.translations||[]).forEach(t=>{langCount[t.language_code]=(langCount[t.language_code]||0)+1}));
  const sortedL=Object.entries(langCount).sort((a,b)=>b[1]-a[1]);
  const maxL=sortedL[0]?.[1]||1;
  const cats={};(articles||[]).forEach(a=>{cats[a.category]=(cats[a.category]||0)+1});
  const sortedC=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxC=sortedC[0]?.[1]||1;
  const sevC={safe:0,low:0,medium:0,high:0,critical:0};
  (articles||[]).forEach(a=>{if(a.sensitivity?.overall_level)sevC[a.sensitivity.overall_level]=(sevC[a.sensitivity.overall_level]||0)+1});
  const total=stats?.total||0;
  const pubRate=total>0?Math.round(((stats?.published||0)/total)*100):0;
  const avgT=total>0?((stats?.total_translations||0)/total).toFixed(1):0;
  const LCOLS={safe:'var(--green)',low:'#84cc16',medium:'var(--yellow)',high:'var(--orange)',critical:'var(--red)'};

  return (
    <div>
      <div style={{marginBottom:16}}><h1 style={{fontSize:19,fontWeight:700,marginBottom:3}}>Analytics</h1>
        <p style={{fontSize:12,color:'var(--text-muted)'}}>Pipeline performance and content distribution insights</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        {[{l:'Publish Rate',v:`${pubRate}%`,s:'of ingested',c:'var(--green)'},
          {l:'Avg. Languages',v:avgT,s:'per article',c:'var(--cyan)'},
          {l:'Total Translations',v:stats?.total_translations||0,s:'generated by AI',c:'var(--purple)'},
          {l:'Critical Flags',v:stats?.critical_flags||0,s:'require attention',c:'var(--red)'},
        ].map(k=>(
          <div key={k.l} className="card" style={{textAlign:'center'}}>
            <div style={{fontSize:28,fontWeight:700,color:k.c}}>{k.v}</div>
            <div style={{fontSize:13,fontWeight:600,margin:'4px 0 2px'}}>{k.l}</div>
            <div style={{fontSize:11,color:'var(--text-muted)'}}>{k.s}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        <div className="card">
          <div className="card-title">Translations by Language</div>
          {sortedL.length===0?<div className="empty" style={{padding:20}}>No data yet.</div>:(
            sortedL.map(([c,n])=>(
              <div key={c} style={{marginBottom:9}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                  <span style={{color:'var(--text-secondary)'}}>{c}</span><strong>{n}</strong>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{width:`${(n/maxL)*100}%`,background:'linear-gradient(90deg,var(--blue),var(--cyan))'}}/></div>
              </div>
            ))
          )}
        </div>
        <div className="card">
          <div className="card-title">Articles by Category</div>
          {sortedC.length===0?<div className="empty" style={{padding:20}}>No data yet.</div>:(
            sortedC.map(([c,n])=>(
              <div key={c} style={{marginBottom:9}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                  <span style={{color:'var(--text-secondary)'}}>{c}</span><strong>{n}</strong>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{width:`${(n/maxC)*100}%`,background:'linear-gradient(90deg,var(--purple),#ec4899)'}}/></div>
              </div>
            ))
          )}
        </div>
      </div>
      <div className="card">
        <div className="card-title">Content Sensitivity Distribution</div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {Object.entries(sevC).map(([lv,n])=>{
            const t=Object.values(sevC).reduce((a,b)=>a+b,0)||1;
            return(
              <div key={lv} style={{display:'flex',alignItems:'center',gap:10}}>
                <span className={`badge sev-${lv}`} style={{minWidth:75}}>{lv}</span>
                <div className="bar-track"><div className="bar-fill" style={{width:`${(n/t)*100}%`,background:LCOLS[lv]}}/></div>
                <span style={{fontSize:12,fontWeight:600,minWidth:20}}>{n}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const SUGGESTIONS = [
  'How does the pipeline work?',
  'What languages are supported?',
  'How to ingest an article?',
  'What is sensitivity analysis?',
  'How to use MCP connector?',
  'What is the readiness score?',
];

let chatIdCounter = 0;
function Chatbot() {
  const [open, setOpen] = useState(false);
  const [showMcp, setShowMcp] = useState(false);
  const [msgs, setMsgs] = useState([
    {id:0, role:'bot', text:'Hello! I\'m your AI Newsroom Assistant. Ask me anything about the platform — features, integration, how to use it, or technical questions! 🎙️', time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
  ]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const [mcpResult, setMcpResult] = useState('');
  const [mcpTools, setMcpTools] = useState([]);
  const msgsEndRef = useRef(null);

  useEffect(() => {
    if (open) msgsEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [msgs, open, typing]);

  useEffect(() => {
    if (showMcp && mcpTools.length === 0) {
      fetch(`${API}/mcp/tools`).then(r=>r.json()).then(d=>setMcpTools(d.tools||[])).catch(()=>{});
    }
  }, [showMcp]);

  const sendMsg = async (text) => {
    if (!text.trim() || typing) return;
    const t = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    setMsgs(p => [...p, {id:++chatIdCounter, role:'user', text, time:t}]);
    setInput('');
    setTyping(true);
    try {
      const res = await fetch(`${API}/api/chat`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message: text, context: 'AI Newsroom platform context'})
      });
      const data = await res.json();
      setMsgs(p => [...p, {id:++chatIdCounter, role:'bot', text: data.reply || 'Sorry, I could not process that.', time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}]);
    } catch(e) {
      setMsgs(p => [...p, {id:++chatIdCounter, role:'bot', text:'Backend not reachable. Please ensure the server is running on port 8000.', time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}]);
    }
    setTyping(false);
  };

  const runMcpTool = async (tool) => {
    setMcpResult('Running...');
    try {
      const res = await fetch(`${API}/mcp/execute`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({tool: tool.name, params: {}})
      });
      const data = await res.json();
      setMcpResult(JSON.stringify(data.result || data.error, null, 2));
    } catch(e) {
      setMcpResult('Error: ' + e.message);
    }
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(input); }
  };

  return (
    <>
      {open && showMcp && (
        <div className="mcp-panel">
          <div className="mcp-hdr">
            <span>🔌</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--purple)'}}>MCP Connector</div>
              <div style={{fontSize:10,color:'var(--text-muted)'}}>Model Context Protocol Tools</div>
            </div>
            <button onClick={()=>setShowMcp(false)} style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:16}}>×</button>
          </div>
          <div className="mcp-tools">
            {mcpTools.map(t=>(
              <div key={t.name} className="mcp-tool" onClick={()=>runMcpTool(t)}>
                <div className="mcp-tool-name">⚡ {t.name}</div>
                <div className="mcp-tool-desc">{t.description}</div>
              </div>
            ))}
            {mcpTools.length===0 && <div style={{fontSize:12,color:'var(--text-muted)',padding:'10px 0'}}>Loading MCP tools...</div>}
          </div>
          {mcpResult && (
            <div className="mcp-result">{mcpResult}</div>
          )}
        </div>
      )}
      {open && (
        <div className="chat-window">
          <div className="chat-hdr">
            <div className="chat-avatar">🤖</div>
            <div className="chat-hdr-info">
              <div className="chat-hdr-name">AI Newsroom Bot</div>
              <div className="chat-hdr-sub">● Online · Powered by Gemini</div>
            </div>
            <button style={{background:'none',border:'none',color:'var(--purple)',cursor:'pointer',fontSize:11,fontWeight:600,marginRight:4}} onClick={()=>setShowMcp(p=>!p)}>🔌 MCP</button>
            <button className="chat-close" onClick={()=>setOpen(false)}>×</button>
          </div>
          <div className="chat-msgs">
            {msgs.map(m => (
              <div key={m.id} className={`msg-row ${m.role}`}>
                {m.role==='bot' && <div style={{width:24,height:24,borderRadius:'50%',background:'linear-gradient(135deg,var(--blue),var(--cyan))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flexShrink:0}}>🤖</div>}
                <div className="msg-bubble">{m.text}</div>
                <span className="msg-time">{m.time}</span>
              </div>
            ))}
            {typing && (
              <div className="msg-row bot">
                <div style={{width:24,height:24,borderRadius:'50%',background:'linear-gradient(135deg,var(--blue),var(--cyan))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12}}>🤖</div>
                <div className="chat-typing"><span/><span/><span/></div>
              </div>
            )}
            <div ref={msgsEndRef}/>
          </div>
          {msgs.length <= 2 && (
            <div className="chat-suggestions">
              {SUGGESTIONS.map(s=>(
                <button key={s} className="chat-sug" onClick={()=>sendMsg(s)}>{s}</button>
              ))}
            </div>
          )}
          <div className="chat-inp">
            <textarea
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={handleKey}
              placeholder="Ask me anything about the platform..."
              rows={1}
            />
            <button className="chat-send" onClick={()=>sendMsg(input)} disabled={!input.trim()||typing}>➤</button>
          </div>
        </div>
      )}
      <button className="chat-fab" onClick={()=>setOpen(p=>!p)} title="AI Assistant">
        {open ? '✕' : '💬'}
        {!open && msgs.length > 1 && <span className="chat-badge">{msgs.filter(m=>m.role==='bot').length}</span>}
      </button>
    </>
  );
}

function Login({onLogin}) {
  const [user,setUser]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const attempt=()=>{
    const u=user.trim().toLowerCase();
    if(!u){setErr('Please enter your name.');return;}
    setLoading(true);
    setTimeout(()=>{
      if(AUTHORIZED[u] && (pass==='' || pass===AUTHORIZED[u])){
        const session={user:u,displayName:user.trim(),time:Date.now()};
        localStorage.setItem('nr_session',JSON.stringify(session));
        onLogin(session);
      } else {
        setErr('Access denied. You are not an authorized member of this platform.');
        setLoading(false);
      }
    },600);
  };

  const fillUser=(name)=>{setUser(name);setErr('');};

  return (
    <div className="login-shell">
      <div className="login-bg"/>
      <div className="login-grid"/>
      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-icon">📡</div>

            <div style={{fontWeight:800,fontSize:16,lineHeight:1.2}}>AI Newsroom</div>

          </div>
        </div>
        <div className="login-badge">
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',animation:'pulse 1.5s ease-in-out infinite'}}/>
          Byte Break Team · Cognizant CODEX Hackathon 2025
        </div>
        <div className="login-title">Secure Access Portal</div>
        <div className="login-sub">Authorized personnel only — AI Newsroom Platform</div>

        <div className="login-field">
          <div className="login-label">👤 Your Name</div>
          <input className="login-input" type="text" placeholder="Enter your name"
            value={user} onChange={e=>{setUser(e.target.value);setErr('');}}
            onKeyDown={e=>e.key==='Enter'&&attempt()}
            autoFocus/>
        </div>
        <div className="login-field">
          <div className="login-label">🔑 Access Code <span style={{color:'var(--text-muted)',textTransform:'none',fontWeight:400}}>(optional for members)</span></div>
          <input className="login-input" type="password" placeholder="Leave blank if not required"
            value={pass} onChange={e=>{setPass(e.target.value);setErr('');}}
            onKeyDown={e=>e.key==='Enter'&&attempt()}/>
        </div>

        <button className="login-btn" onClick={attempt} disabled={loading}>
          {loading?'Verifying Access...':'Enter Newsroom →'}
        </button>

        {err&&(
          <div className="login-error">
            <span style={{fontSize:16}}>🚫</span> {err}
          </div>
        )}

        <div className="login-users">
          <div className="login-users-title">Authorized Team Members</div>
          <div className="login-user-chips">
            {['Sowmiya','Cognizant','Admin','Editor','Newsroom'].map(n=>(
              <span key={n} className="login-chip" onClick={()=>fillUser(n)}>{n}</span>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

      if(s&&(Date.now()-s.time)<8*60*60*1000)return s;
    }catch(_){}
    return null;
  });
  const [page,setPage]=useState('dashboard');
  const [stats,setStats]=useState(null);
  const [articles,setArticles]=useState([]);
  const [events,setEvents]=useState([]);
  const [toasts,setToasts]=useState([]);
  const [demo,setDemo]=useState(false);
  const wsRef=useRef(null);

  // ALL hooks must run before any early return — Rules of Hooks
  const toast=(type,title,msg)=>{
    const id=++toastId;
    setToasts(p=>[{id,type,title,msg},...p.slice(0,4)]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),5000);
  };

  const load=useCallback(async()=>{
    try{
      const [s,a]=await Promise.all([api('GET','/api/stats'),api('GET','/api/articles')]);
      setStats(s);setArticles(a.articles);
    }catch(e){}
  },[]);

  useEffect(()=>{
    if(!session)return;
    load();
    const iv=setInterval(load,8000);
    return ()=>clearInterval(iv);
  },[load,session]);

  useEffect(()=>{
    if(!session)return;
    const connect=()=>{
      try{
        const ws=new WebSocket(`${WS}/ws`);
        ws.onmessage=e=>{
          try{const ev=JSON.parse(e.data);
            setEvents(p=>[ev,...p.slice(0,29)]);
            if(ev.event==='translation_done')toast('success','Translation Done',`${ev.language} ready for #${ev.article_id}`);
            else if(ev.event==='ready_for_review')toast('info','Ready for Review',`Article #${ev.article_id} is in the editor queue`);
            else if(ev.event==='sensitivity_done'&&['high','critical'].includes(ev.sensitivity?.overall_level))toast('warning','Sensitivity Alert',`#${ev.article_id} flagged as ${ev.sensitivity.overall_level}`);
            load();
          }catch(_){}
        };
        ws.onerror=()=>{};
        ws.onclose=()=>setTimeout(connect,3000);
        wsRef.current=ws;
      }catch(e){}
    };
    connect();
    return()=>wsRef.current?.close();
  },[load,session]);

  const logout=()=>{localStorage.removeItem('nr_session');setSession(null);};

  // Safe to early return — all hooks are above
  if(!session) return <Login onLogin={s=>setSession(s)}/>;

  const runDemo=async()=>{
    setDemo(true);
    toast('info','⚡ Live Demo','Ingesting breaking news article...');
    try{
      const r=await api('POST','/api/articles',DEMO);
      toast('success','Demo Running',`Article #${r.article_id} created. Watch the pipeline!`);
      setPage('dashboard');load();
    }catch(e){toast('error','Demo Failed','Make sure backend is running on port 8000.');}
    setTimeout(()=>setDemo(false),30000);
  };

  const reviewCount=(articles||[]).filter(a=>a.status==='review').length;
  const processingCount=(articles||[]).filter(a=>a.status==='processing').length;
  const TITLES={dashboard:{t:'Newsroom Dashboard',s:'Real-time AI content localization pipeline'},ingest:{t:'Ingest Content',s:'Submit articles or broadcast transcripts'},review:{t:'Review Queue',s:'Editorial review before broadcasting'},broadcast:{t:'Broadcast Studio',s:'AI News Presenter with multilingual voice & multi-format publishing'},published:{t:'Published Articles',s:'Live multilingual content'},analytics:{t:'Analytics',s:'Pipeline performance insights'}};
  const pt=TITLES[page]||TITLES.dashboard;

  return (
    <div className="shell">
      <Sidebar page={page} nav={setPage} reviewCount={reviewCount} processingCount={processingCount}/>
      <div className="main">
        <header className="hdr">
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:600}}>{pt.t}</div>
            <div style={{fontSize:11,color:'var(--text-muted)'}}>{pt.s}</div>
          </div>
          {stats&&(
            <div style={{fontSize:11,color:'var(--text-muted)',display:'flex',gap:12}}>
              <span style={{color:'var(--green)'}}>● {stats.published} Published</span>
              <span style={{color:'var(--purple)'}}>● {stats.review} In Review</span>
              <span style={{color:'var(--blue)'}}>● {stats.processing} Processing</span>
            </div>
          )}
          <button className={`demo-btn${demo?' run':''}`} onClick={runDemo} disabled={demo}>
            {demo?'⚡ Demo Running...':'⚡ Live Demo'}
          </button>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',borderRadius:8,background:'var(--bg-card)',border:'1px solid var(--border)'}}>
            <div style={{width:26,height:26,borderRadius:'50%',background:'linear-gradient(135deg,var(--blue),var(--cyan))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'white'}}>
              {session.displayName?.[0]?.toUpperCase()||'U'}
            </div>
            <div style={{lineHeight:1.2}}>
              <div style={{fontSize:12,fontWeight:600,color:'var(--text-primary)'}}>{session.displayName}</div>
              <div style={{fontSize:10,color:'var(--text-muted)'}}>Authorized</div>
            </div>
            <button onClick={logout} title="Logout"
              style={{marginLeft:4,background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:14,padding:'2px 4px',borderRadius:4}}
              onMouseOver={e=>e.target.style.color='var(--red)'}
              onMouseOut={e=>e.target.style.color='var(--text-muted)'}>⏻</button>
          </div>
        </header>
        <main className="page">
          {page==='dashboard'&&<Dashboard stats={stats} articles={articles} events={events} nav={setPage}/>}
          {page==='ingest'&&<Ingest onCreated={load} toast={toast}/>}
          {page==='review'&&<Review articles={articles} events={events} toast={toast} refresh={load}/>}
          {page==='broadcast'&&<Broadcast articles={articles} toast={toast}/>}
          {page==='published'&&<Published articles={articles}/>}
          {page==='analytics'&&<Analytics stats={stats} articles={articles}/>}
        </main>
      </div>
      <Toasts toasts={toasts}/>
      <Chatbot/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
