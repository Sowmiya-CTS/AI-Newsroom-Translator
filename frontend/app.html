<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Newsroom Assistant | Real-Time Content Localization</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE"></script>
<style>
:root{--bg-base:#060d1a;--bg-surface:#0d1626;--bg-card:#111e30;--bg-elevated:#162033;--bg-hover:#1a2840;--bg-input:#0a1320;--border:#1e3048;--border-light:#243a56;--text-primary:#f0f4ff;--text-secondary:#8ba3c1;--text-muted:#4a6280;--blue:#3b82f6;--blue-dk:#1d4ed8;--cyan:#06b6d4;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--purple:#8b5cf6;--sidebar-w:220px;--header-h:58px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-base);color:var(--text-primary);min-height:100vh;font-size:14px}
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200}
.brand{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;height:var(--header-h)}
.brand-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.brand-text{font-size:12px;font-weight:700;line-height:1.3}
.brand-text span{color:var(--cyan)}
.nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;padding:8px 10px 4px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text-secondary);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:all .15s;position:relative}
.nav-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-btn.active{background:rgba(59,130,246,.12);color:var(--blue)}
.nav-btn.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--blue);border-radius:2px}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px}
.nbadge.b{background:var(--blue)}
.sfooter{padding:10px 8px;border-top:1px solid var(--border)}
.live-ind{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:6px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);font-size:11px;color:var(--green);margin-bottom:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.main{flex:1;display:flex;flex-direction:column;margin-left:var(--sidebar-w)}
.hdr{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--header-h);background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;z-index:100;gap:12px}
.hdr-title{font-size:15px;font-weight:600;flex:1}
.hdr-sub{font-size:11px;color:var(--text-muted)}
.demo-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(59,130,246,.2));border:1px solid rgba(139,92,246,.4);color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.demo-btn:hover{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(59,130,246,.3))}
.demo-btn.run{color:var(--yellow);border-color:rgba(245,158,11,.4);animation:sh 1.5s infinite}
@keyframes sh{0%,100%{opacity:1}50%{opacity:.7}}
.page{flex:1;padding:22px 24px;margin-top:var(--header-h);overflow-y:auto}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.scard{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.scard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.scard.blue::after{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.scard.green::after{background:linear-gradient(90deg,var(--green),#34d399)}
.scard.yellow::after{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.scard.purple::after{background:linear-gradient(90deg,var(--purple),#ec4899)}
.scard.cyan::after{background:linear-gradient(90deg,var(--cyan),var(--blue))}
.scard.red::after{background:linear-gradient(90deg,var(--red),var(--orange))}
.scard.teal::after{background:linear-gradient(90deg,#14b8a6,var(--green))}
.scard.gray::after{background:linear-gradient(90deg,#64748b,#94a3b8)}
.sv{font-size:28px;font-weight:700}
.sl{font-size:10px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bp{background:var(--blue);color:#fff}
.bp:hover:not(:disabled){background:var(--blue-dk)}
.bs{background:var(--green);color:#fff}
.bs:hover:not(:disabled){background:#059669}
.bd{background:var(--red);color:#fff}
.bd:hover:not(:disabled){background:#dc2626}
.bg{background:transparent;color:var(--text-secondary);border:1px solid var(--border-light)}
.bg:hover:not(:disabled){background:var(--bg-hover);color:var(--text-primary)}
.bc{background:rgba(6,182,212,.12);color:var(--cyan);border:1px solid rgba(6,182,212,.3)}
.fi{width:100%;padding:8px 11px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px}
.fi:focus{outline:none;border-color:var(--blue)}
.ta{width:100%;padding:8px 11px;resize:vertical;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;line-height:1.6}
.ta:focus{outline:none;border-color:var(--blue)}
.fl{display:block;font-size:11px;font-weight:500;color:var(--text-secondary);margin-bottom:4px}
.fg{margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 14px;background:none;border:none;color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.art-item{padding:10px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;margin-bottom:5px}
.art-item:hover{border-color:var(--border-light)}
.art-item.sel{border-color:var(--blue);background:rgba(59,130,246,.06)}
.aih{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.aid{font-size:10px;color:var(--text-muted);font-family:monospace}
.at{font-size:13px;font-weight:500;margin-bottom:5px}
.am{display:flex;gap:10px;font-size:11px;color:var(--text-muted)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.b-pending{background:rgba(100,116,139,.2);color:#94a3b8}
.b-processing{background:rgba(59,130,246,.15);color:var(--blue)}
.b-review{background:rgba(139,92,246,.15);color:var(--purple)}
.b-approved{background:rgba(16,185,129,.15);color:var(--green)}
.b-published{background:rgba(6,182,212,.15);color:var(--cyan)}
.b-rejected{background:rgba(239,68,68,.15);color:var(--red)}
.sev-safe{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.sev-low{background:rgba(132,204,22,.12);color:#84cc16;border:1px solid rgba(132,204,22,.2)}
.sev-medium{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}
.sev-high{background:rgba(249,115,22,.12);color:var(--orange);border:1px solid rgba(249,115,22,.2)}
.sev-critical{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.lp{font-size:11px;color:var(--cyan);margin-top:5px;display:flex;align-items:center;gap:4px}
.toast-c{position:fixed;top:66px;right:16px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:9px;background:var(--bg-elevated);border:1px solid var(--border-light);box-shadow:0 4px 20px rgba(0,0,0,.4);font-size:12px;max-width:320px;pointer-events:all;animation:tin .3s ease}
.toast.success{border-left:3px solid var(--green)}
.toast.info{border-left:3px solid var(--blue)}
.toast.warning{border-left:3px solid var(--yellow)}
.toast.error{border-left:3px solid var(--red)}
@keyframes tin{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-txt strong{display:block;margin-bottom:1px;font-size:12px}
.toast-txt span{color:var(--text-secondary)}
.divider{height:1px;background:var(--border);margin:14px 0}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px}
.empty-ico{font-size:32px;margin-bottom:10px;opacity:.5}
.alert-s{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);color:var(--green);padding:9px 12px;border-radius:6px;font-size:12px;margin-top:8px}
.alert-i{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);color:var(--blue);padding:9px 12px;border-radius:6px;font-size:12px;margin-top:8px}
.alert-e{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:var(--red);padding:9px 12px;border-radius:6px;font-size:12px;margin-top:8px}
.lang-grid{display:flex;flex-wrap:wrap;gap:7px}
.lang-chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .15s;user-select:none}
.lang-chip.on{background:rgba(59,130,246,.1);border-color:var(--blue);color:var(--text-primary)}
.sbar{display:flex;align-items:center;gap:7px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:7px 11px;margin-bottom:10px}
.sbar input{background:none;border:none;color:var(--text-primary);font-size:13px;flex:1;outline:none}
.sens-box{border-radius:8px;padding:14px;border:1px solid;margin-bottom:12px}
.flag-it{background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:7px}
.sp{font-size:13px;font-weight:600;margin-bottom:4px}
.pub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pub-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.pub-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.pub-card:hover{border-color:var(--border-light);transform:translateY(-2px)}
.mini-chip{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);margin:2px}
/* ── Broadcast Studio ── */
.tv-frame{background:#000;border-radius:12px;overflow:hidden;border:3px solid #1a2840;box-shadow:0 0 40px rgba(0,0,0,.8);position:relative;aspect-ratio:16/9;width:100%}
.tv-header{background:linear-gradient(135deg,#0a1628,#0d1f3c);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--red)}
.network-logo{font-size:18px;font-weight:900;letter-spacing:2px;color:white;text-shadow:0 0 10px rgba(255,255,255,.3)}
.live-bug{display:flex;align-items:center;gap:6px;background:var(--red);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;color:white;letter-spacing:1px}
.tv-studio{display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,#050d1a 0%,#0a1628 60%,#0d1f3c 100%);padding:20px;min-height:260px;position:relative}
.presenter-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.avatar-circle{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#1a3a5c,#0d2540);border:3px solid rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;box-shadow:0 0 30px rgba(59,130,246,.2)}
.avatar-speaking .avatar-circle{animation:avatarPulse 0.5s ease infinite alternate;border-color:rgba(6,182,212,.7);box-shadow:0 0 40px rgba(6,182,212,.3)}
@keyframes avatarPulse{from{transform:scale(1);box-shadow:0 0 30px rgba(6,182,212,.2)}to{transform:scale(1.03);box-shadow:0 0 50px rgba(6,182,212,.4)}}
.mouth{position:absolute;bottom:22px;width:24px;height:6px;background:rgba(255,220,180,.8);border-radius:0 0 12px 12px}
.avatar-speaking .mouth{animation:mouth 0.2s ease infinite alternate}
@keyframes mouth{from{height:3px;border-radius:0 0 6px 6px}to{height:10px;border-radius:0 0 14px 14px}}
.avatar-body{width:100px;height:55px;background:linear-gradient(180deg,#1e3a5c,#152d47);border-radius:6px 6px 0 0;margin-top:-4px}
.lower-third{position:absolute;bottom:0;left:0;right:0;padding:8px 14px;background:rgba(0,0,0,.8)}
.reporter-name{font-size:13px;font-weight:700;color:white;display:flex;align-items:center;gap:6px}
.reporter-sub{font-size:10px;color:rgba(255,255,255,.6)}
.news-ticker{background:var(--red);padding:5px 0;overflow:hidden;border-top:1px solid rgba(255,255,255,.1)}
.ticker-inner{display:flex;align-items:center;white-space:nowrap;animation:ticker 30s linear infinite}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}
.ticker-text{white-space:nowrap;font-size:11px;font-weight:600;color:white;padding:0 20px;letter-spacing:.3px}
.breaking-banner{background:linear-gradient(90deg,var(--red),#b91c1c);padding:5px 18px;font-size:11px;font-weight:800;color:white;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.script-box{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:12px;font-size:12px;color:rgba(255,255,255,.85);line-height:1.7;max-height:120px;overflow-y:auto;text-align:center;font-style:italic}
.tts-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tts-btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.tts-play{background:var(--green);color:white}
.tts-stop{background:var(--red);color:white}
.tts-lang{padding:7px 12px;border-radius:6px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);font-size:12px}
.fmt-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.fmt-label{font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fmt-content{font-size:12px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap}
.readiness-ring{width:80px;height:80px;position:relative;flex-shrink:0}
.readiness-ring svg{transform:rotate(-90deg)}
.readiness-score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.sla-bar{display:flex;gap:6px;align-items:center;margin-bottom:7px;font-size:12px}
.sla-stage{padding:3px 9px;border-radius:4px;font-size:10px;font-weight:600}
.bar-track{height:6px;background:var(--border);border-radius:3px;flex:1}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
/* ── AI Chatbot ── */
.chat-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(59,130,246,.4);z-index:1000;transition:all .2s}
.chat-fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(59,130,246,.6)}
.chat-fab .chat-badge{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--bg-base);font-size:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
.chat-window{position:fixed;bottom:86px;right:24px;width:360px;height:520px;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.6);z-index:1000;animation:chat-in .2s ease}
@keyframes chat-in{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.chat-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;border-radius:14px 14px 0 0;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(6,182,212,.1))}
.chat-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.chat-hdr-info{flex:1}
.chat-hdr-name{font-size:13px;font-weight:700}
.chat-hdr-sub{font-size:10px;color:var(--green)}
.chat-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:4px}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;align-items:flex-end;gap:8px}
.msg-row.user{flex-direction:row-reverse}
.msg-bubble{max-width:76%;padding:9px 12px;border-radius:12px;font-size:12px;line-height:1.6}
.msg-row.bot .msg-bubble{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);border-radius:4px 12px 12px 12px}
.msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--blue),#2563eb);color:white;border-radius:12px 4px 12px 12px}
.msg-time{font-size:9px;color:var(--text-muted);flex-shrink:0}
.chat-typing{display:flex;gap:4px;padding:10px 14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px 12px 12px 12px;width:fit-content}
.chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:dot .8s ease infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.chat-suggestions{padding:0 12px 8px;display:flex;flex-wrap:wrap;gap:5px}
.chat-sug{padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chat-sug:hover{border-color:var(--blue);color:var(--text-primary)}
.chat-inp{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.chat-inp textarea{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:12px;padding:8px 10px;resize:none;font-family:inherit;min-height:36px;max-height:90px;outline:none}
.chat-inp textarea:focus{border-color:var(--blue)}
.chat-send{background:var(--blue);border:none;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:16px;flex-shrink:0;transition:all .15s}
.chat-send:hover{background:var(--blue-dk)}
.chat-send:disabled{opacity:.4;cursor:not-allowed}
/* Video Thumbnails */
.vid-thumb{height:130px;overflow:hidden;position:relative;margin:-16px -16px 12px;background:linear-gradient(135deg,#0d1f3c,#0a1628);border-radius:10px 10px 0 0}
.vid-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vid-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:all .2s}
.pub-card:hover .vid-btn{background:rgba(255,255,255,.3);transform:scale(1.1)}
/* Language chips in broadcast */
.lang-chips-row{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 14px}
.lchip{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .15s;font-weight:400}
.lchip.active{border-color:var(--cyan);background:rgba(6,182,212,.12);color:var(--cyan);font-weight:700}
@keyframes audioBar{0%{height:5px}100%{height:22px}}
/* Login Page */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-base);position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(59,130,246,.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 70%,rgba(6,182,212,.06) 0%,transparent 55%)}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(30,48,72,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(30,48,72,.3) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.login-card{background:var(--bg-surface);border:1px solid var(--border-light);border-radius:18px;padding:40px 44px;width:420px;max-width:92vw;position:relative;z-index:1;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;justify-content:center}
.login-logo-icon{width:46px;height:46px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.login-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:30px}
.login-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--blue);margin-bottom:28px;width:100%;justify-content:center}
.login-field{margin-bottom:16px}
.login-label{font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
.login-input{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text-primary);font-size:14px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--blue)}
.login-input::placeholder{color:var(--text-muted)}
.login-btn{width:100%;padding:13px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;color:white;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s;letter-spacing:.3px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#f87171;margin-top:12px;display:flex;align-items:center;gap:8px}
.login-users{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.login-users-title{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
.login-user-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.login-chip{padding:4px 11px;border-radius:14px;background:var(--bg-elevated);border:1px solid var(--border);font-size:11px;color:var(--text-secondary);cursor:pointer;transition:all .15s}
.login-chip:hover{border-color:var(--cyan);color:var(--cyan)}
/* MCP Panel */
.mcp-panel{position:fixed;bottom:86px;right:400px;width:300px;height:420px;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.6);z-index:999;animation:chat-in .2s ease}
.mcp-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(59,130,246,.1));border-radius:14px 14px 0 0}
.mcp-tools{flex:1;overflow-y:auto;padding:10px}
.mcp-tool{padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.mcp-tool:hover{border-color:var(--purple);background:rgba(139,92,246,.06)}
.mcp-tool-name{font-size:12px;font-weight:600;color:var(--purple);margin-bottom:3px}
.mcp-tool-desc{font-size:11px;color:var(--text-muted)}
.mcp-result{padding:10px;border-top:1px solid var(--border);background:var(--bg-elevated);font-size:11px;color:var(--text-secondary);max-height:120px;overflow-y:auto;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = 'http://127.0.0.1:8000';
const WS  = 'ws://127.0.0.1:8000';

const LANGS = [
  {code:'hi',name:'Hindi'},{code:'ta',name:'Tamil'},{code:'te',name:'Telugu'},
  {code:'bn',name:'Bengali'},{code:'mr',name:'Marathi'},{code:'gu',name:'Gujarati'},
  {code:'kn',name:'Kannada'},{code:'ml',name:'Malayalam'},{code:'pa',name:'Punjabi'},
  {code:'or',name:'Odia'},{code:'fr',name:'French'},{code:'es',name:'Spanish'},{code:'ar',name:'Arabic'}
];

const DEMO = {
  title:'Major Earthquake Strikes Off Japan Coast — Tsunami Warning Issued',
  content:'A powerful earthquake measuring 7.2 on the Richter scale struck off the northeastern coast of Japan at 5:48 AM local time on Thursday. The Japan Meteorological Agency immediately issued a tsunami warning for coastal prefectures including Iwate, Miyagi, and Fukushima. Residents within one kilometer of the coast have been ordered to evacuate to higher ground. The epicenter was located approximately 80 kilometers east of Sendai at a depth of 35 kilometers. Emergency response teams have been deployed to affected areas. At least 12 injuries have been reported in Sendai city. The government has convened an emergency response committee. International agencies including the Pacific Tsunami Warning Center have extended warnings to neighboring countries.',
  source:'AP Wire / NHK',category:'International',priority:'breaking',
  target_languages:['hi','ta','te','bn','mr','gu']
};

let toastId = 0;
async function api(method, path, body) {
  const r = await fetch(API + path, {
    method, headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Toast ──
function Toasts({toasts}) {
  return (
    <div className="toast-c">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span style={{fontSize:15}}>{t.type==='success'?'✓':t.type==='error'?'✕':t.type==='warning'?'⚠':'ℹ'}</span>
          <div className="toast-txt"><strong>{t.title}</strong><span>{t.msg}</span></div>
        </div>
      ))}
    </div>
  );
}

// ── Sidebar ──
function Sidebar({page, nav, reviewCount, processingCount}) {
  const items = [
    {id:'dashboard', icon:'▦', label:'Dashboard'},
    {id:'ingest',    icon:'⊕', label:'Ingest Content'},
    {id:'review',    icon:'◈', label:'Review Queue'},
    {id:'broadcast', icon:'📺', label:'Broadcast Studio'},
    {id:'published', icon:'◉', label:'Published'},
    {id:'analytics', icon:'▣', label:'Analytics'},
  ];
  return (
    <aside className="sidebar">
      <div className="brand">
        <div className="brand-icon">📡</div>
        <div className="brand-text">AI Newsroom<br/><span>Assistant</span></div>
      </div>
      <nav className="nav">
        <div className="nav-lbl">Navigation</div>
        {items.map(it => (
          <button key={it.id} className={`nav-btn${page===it.id?' active':''}`} onClick={()=>nav(it.id)}>
            <span style={{fontSize:15,width:18}}>{it.icon}</span>
            {it.label}
            {it.id==='review' && reviewCount>0 && <span className="nbadge">{reviewCount}</span>}
            {it.id==='ingest' && processingCount>0 && <span className="nbadge b">{processingCount}</span>}
          </button>
        ))}
        <div className="nav-lbl" style={{marginTop:10}}>Supported</div>
        <div style={{padding:'4px 10px',fontSize:11,color:'var(--text-muted)',lineHeight:1.9}}>
          Hindi · Tamil · Telugu · Bengali<br/>Marathi · Gujarati · Kannada<br/>Malayalam · Punjabi · Odia<br/>French · Spanish · Arabic
        </div>
      </nav>
      <div className="sfooter">
        <div className="live-ind"><div className="pulse"/>AI Pipeline Active</div>
        <div style={{fontSize:10,color:'var(--text-muted)',padding:'0 4px'}}>
          Powered by Byte Break Team<br/>Cognizant CODEX Hackathon 2025
        </div>
      </div>
    </aside>
  );
}

// ── Dashboard ──
function Dashboard({stats,articles,events,nav}) {
  const STAT_CFG = [
    {key:'total',label:'Total Articles',color:'blue'},
    {key:'processing',label:'Processing',color:'cyan'},
    {key:'review',label:'Awaiting Review',color:'yellow'},
    {key:'approved',label:'Approved',color:'green'},
    {key:'published',label:'Published',color:'purple'},
    {key:'total_translations',label:'Translations',color:'teal'},
    {key:'critical_flags',label:'Critical Flags',color:'red'},
    {key:'rejected',label:'Rejected',color:'gray'},
  ];
  const recent = (articles||[]).slice(0,5);
  const evDesc = e => {
    if(e.event==='translation_done') return `${e.language} translated`;
    if(e.event==='sensitivity_done') return 'Sensitivity analyzed';
    if(e.event==='ready_for_review') return 'Ready for editor review';
    if(e.event==='editor_action') return `Editor: ${e.action}`;
    return e.event;
  };
  return (
    <div>
      <div style={{marginBottom:18}}>
        <h1 style={{fontSize:19,fontWeight:700,marginBottom:3}}>Newsroom Dashboard</h1>
        <p style={{fontSize:12,color:'var(--text-muted)'}}>Real-time AI content localization pipeline overview</p>
      </div>
      <div className="stats-grid">
        {STAT_CFG.map(s=>(
          <div key={s.key} className={`scard ${s.color}`}>
            <div className="sv">{stats?(stats[s.key]??0):'—'}</div>
            <div className="sl">{s.label}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:14}}>
        <div className="card">
          <div className="ch">
            <div className="card-title" style={{marginBottom:0}}>Recent Articles</div>
            <button className="btn bg" style={{padding:'4px 10px',fontSize:11}} onClick={()=>nav('review')}>View All →</button>
          </div>
          {recent.length===0?(
            <div className="empty"><div className="empty-ico">📰</div><p>No articles yet.<br/>Go to Ingest Content to start.</p></div>
          ):(
            recent.map(a=>(
              <div key={a.id} className="art-item" onClick={()=>nav('review')}>
                <div className="aih">
                  <span className="aid">#{a.id}</span>
                  <span className={`badge b-${a.status}`}>{a.status}</span>
                  {a.sensitivity&&<span className={`badge sev-${a.sensitivity.overall_level}`}>{a.sensitivity.overall_level}</span>}
                  {a.priority==='breaking'&&<span style={{fontSize:10,color:'var(--red)',fontWeight:700}}>⚡ BREAKING</span>}
                </div>
                <div className="at">{a.title}</div>
                <div className="am"><span>{a.source}</span><span>{a.category}</span><span>{(a.translations||[]).length} langs</span></div>
              </div>
            ))
          )}
        </div>
        <div className="card">
          <div className="ch">
            <div className="card-title" style={{marginBottom:0}}>Live Activity</div>
            <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--green)'}}><div className="pulse"/>LIVE</div>
          </div>
          {events.length===0?(
            <div className="empty" style={{padding:20}}><div style={{fontSize:22,marginBottom:8}}>📡</div><p>Waiting for events.<br/>Ingest an article to begin.</p></div>
          ):(
            <div style={{maxHeight:340,overflowY:'auto'}}>
              {events.map((e,i)=>(
                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'7px 0',borderBottom:'1px solid var(--border)',fontSize:12}}>
                  <div style={{width:6,height:6,borderRadius:'50%',background:e.event==='translation_done'?'var(--green)':e.event==='ready_for_review'?'var(--purple)':e.event==='translation_error'?'var(--red)':'var(--blue)',marginTop:4,flexShrink:0}}/>
                  <span style={{color:'var(--text-secondary)'}}><strong style={{color:'var(--text-primary)'}}>#{e.article_id}</strong> — {evDesc(e)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
      <div className="card" style={{marginTop:14}}>
        <div className="card-title">AI Processing Pipeline</div>
        <div style={{display:'flex',alignItems:'center',flexWrap:'wrap',gap:6}}>
          {['1. Ingest','2. Transcribe','3. Sensitivity','4. Translate','5. Adapt','6. Review','7. Publish'].map((s,i,arr)=>(
            <React.Fragment key={s}>
              <div style={{background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.25)',color:'var(--green)',padding:'6px 12px',borderRadius:6,fontSize:12,fontWeight:500}}>✓ {s}</div>
              {i<arr.length-1&&<span style={{color:'var(--border-light)',fontSize:12}}>→</span>}
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Ingest ──
function Ingest({onCreated,toast}) {
  const [mode,setMode]=useState('article');
  const [title,setTitle]=useState('');
  const [content,setContent]=useState('');
  const [source,setSource]=useState('');
  const [category,setCategory]=useState('General');
  const [priority,setPriority]=useState('normal');
  const [langs,setLangs]=useState(['hi','ta','te','bn']);
  const [raw,setRaw]=useState('');
  const [loading,setLoading]=useState(false);
  const [lastId,setLastId]=useState(null);

  const CATS=['General','Politics','Business','Sports','Entertainment','Health','Technology','International','Environment','Science'];
  const SAMPLES=[
    {icon:'⚡',type:'Breaking News',title:'Major Earthquake Strikes Off Japan Coast — Tsunami Warning Issued',
     content:'A powerful earthquake measuring 7.2 on the Richter scale struck off the northeastern coast of Japan at 5:48 AM local time. The Japan Meteorological Agency issued a tsunami warning for Iwate, Miyagi, and Fukushima. Residents have been ordered to evacuate. Emergency response teams have been deployed. At least 12 injuries reported in Sendai city.',
     source:'AP Wire',category:'International',priority:'breaking'},
    {icon:'🏛',type:'Politics',title:'PM Announces $50B Economic Policy Package',
     content:'The Prime Minister today announced a comprehensive economic policy package worth 50 billion dollars, aimed at revitalizing domestic manufacturing and creating 2 million jobs over five years. The package includes tax incentives for small businesses and 20 billion dollars in infrastructure investment. Opposition parties have criticized the plan as inadequate.',
     source:'Reuters',category:'Politics',priority:'high'},
    {icon:'🏆',type:'Sports',title:'National Team Wins Championship After 30 Years',
     content:'In a thrilling final at Wembley Stadium, the national football team secured a historic 3-2 victory to clinch the international title for the first time in 30 years. Captain Rahul Sharma scored the decisive goal in the 89th minute. Thousands of fans erupted in celebration across the country.',
     source:'ESPN',category:'Sports',priority:'normal'},
  ];
  const toggle = c => setLangs(p=>p.includes(c)?p.filter(l=>l!==c):[...p,c]);
  const apply = s => {setMode('article');setTitle(s.title);setContent(s.content);setSource(s.source);setCategory(s.category);setPriority(s.priority)};
  const submit = async () => {
    if(mode==='article'&&(!title.trim()||!content.trim())){toast('error','Validation Error','Title and content are required.');return;}
    if(mode==='transcribe'&&!raw.trim()){toast('error','Validation Error','Paste a broadcast transcript.');return;}
    if(langs.length===0){toast('error','Validation Error','Select at least one language.');return;}
    setLoading(true);
    try {
      let res;
      if(mode==='transcribe'){
        res=await api('POST','/api/transcribe',{audio_text:raw,source_language:'en'});
        setLastId(res.article_id);
        toast('success','Transcript Ingested',`Article #${res.article_id} created. Pipeline running...`);
        setRaw('');
      } else {
        res=await api('POST','/api/articles',{title,content,source,category,priority,target_languages:langs});
        setLastId(res.article_id);
        toast('success','Article Ingested',`Article #${res.article_id} created. Translating to ${langs.length} languages...`);
        setTitle('');setContent('');setSource('');
      }
      onCreated();
    } catch(e){toast('error','Failed',e.message);}
    setLoading(false);
  };

  return (
    <div>
      <div style={{marginBottom:16}}><h1 style={{fontSize:19,fontWeight:700,marginBottom:3}}>Ingest Content</h1>
        <p style={{fontSize:12,color:'var(--text-muted)'}}>Submit a news article or raw broadcast transcript to start the AI localization pipeline.</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:14,alignItems:'start'}}>
        <div>
          <div className="card" style={{marginBottom:12}}>
            <div className="tabs" style={{marginBottom:0}}>
              <button className={`tab${mode==='article'?' active':''}`} onClick={()=>setMode('article')}>📝 News Article</button>
              <button className={`tab${mode==='transcribe'?' active':''}`} onClick={()=>setMode('transcribe')}>🎙 Broadcast Transcript</button>
            </div>
          </div>
          <div className="card">
            {mode==='article'?(
              <>
                <div className="fg"><label className="fl">Headline *</label><input className="fi" placeholder="e.g. Earthquake Strikes Japan Coast" value={title} onChange={e=>setTitle(e.target.value)}/></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}}>
                  <div><label className="fl">Source</label><input className="fi" placeholder="Reuters, AP..." value={source} onChange={e=>setSource(e.target.value)}/></div>
                  <div><label className="fl">Category</label>
                    <select className="fi" value={category} onChange={e=>setCategory(e.target.value)}>
                      {CATS.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div><label className="fl">Priority</label>
                    <select className="fi" value={priority} onChange={e=>setPriority(e.target.value)}>
                      <option value="normal">Normal</option>
                      <option value="high">High</option>
                      <option value="breaking">⚡ Breaking</option>
                    </select>
                  </div>
                </div>
                <div className="fg"><label className="fl">Article Content *</label><textarea className="ta" rows={7} placeholder="Full article text..." value={content} onChange={e=>setContent(e.target.value)}/></div>
              </>
            ):(
              <div className="fg">
                <label className="fl">Raw Broadcast Transcript *</label>
                <textarea className="ta" rows={9} placeholder="Paste raw spoken transcript here. Claude will clean, structure, categorize, and generate a headline automatically..." value={raw} onChange={e=>setRaw(e.target.value)}/>
                <div className="alert-i" style={{marginTop:8}}>Claude auto-generates headline, structure, category, and key facts from raw transcripts.</div>
              </div>
            )}
            <div className="divider"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9}}>
              <label className="fl" style={{marginBottom:0}}>Target Languages ({langs.length})</label>
              <div style={{display:'flex',gap:7}}>
                <button className="btn bg" style={{padding:'3px 9px',fontSize:11}} onClick={()=>setLangs(LANGS.map(l=>l.code))}>All</button>
                <button className="btn bg" style={{padding:'3px 9px',fontSize:11}} onClick={()=>setLangs([])}>Clear</button>
              </div>
            </div>
            <div className="lang-grid" style={{marginBottom:14}}>
              {LANGS.map(l=>(
                <div key={l.code} className={`lang-chip${langs.includes(l.code)?' on':''}`} onClick={()=>toggle(l.code)}>{l.name}</div>
              ))}
            </div>
            <button className="btn bp" style={{width:'100%',padding:'10px',fontSize:13}} onClick={submit} disabled={loading}>
              {loading?'Processing...':mode==='transcribe'?'🎙 Transcribe & Localize':'🚀 Ingest & Start Localization'}
            </button>
            {lastId&&<div className="alert-s">✓ Article #{lastId} created. Check the Review Queue in ~30 seconds.</div>}
          </div>
        </div>
        <div>
          <div className="card" style={{marginBottom:12}}>
            <div className="sp" style={{marginBottom:12}}>Quick-Fill Templates</div>
            {SAMPLES.map((s,i)=>(
              <div key={i} onClick={()=>apply(s)} style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',borderRadius:6,padding:'10px 12px',cursor:'pointer',marginBottom:8,transition:'all .15s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-light)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
                  <span>{s.icon}</span><span style={{fontSize:11,color:'var(--cyan)',fontWeight:600}}>{s.type}</span>
                  <span style={{fontSize:10,color:'var(--text-muted)',marginLeft:'auto'}}>{s.source}</span>
                </div>
                <div style={{fontSize:12,fontWeight:500,marginBottom:3}}>{s.title}</div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>{s.content.slice(0,80)}...</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Review ──
function Review({articles,events,toast,refresh}) {
  const [sel,setSel]=useState(null);
  const [full,setFull]=useState(null);
  const [tab,setTab]=useState('sensitivity');
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('');
  const [note,setNote]=useState('');
  const [actLang,setActLang]=useState(null);
  const [editMode,setEditMode]=useState(false);
  const [editTxt,setEditTxt]=useState('');
  const [loading,setLoading]=useState('');
  const [tone,setTone]=useState(null);
  const [summary,setSummary]=useState('');

  const loadFull = async a => {
    setSel(a);setTab('sensitivity');setActLang(null);setTone(null);setSummary('');
    try{const r=await api('GET',`/api/articles/${a.id}`);setFull(r);}catch(e){}
  };
  const doAction = async act => {
    if(!sel)return;
    setLoading(act);
    try{
      await api('POST',`/api/articles/${sel.id}/action`,{article_id:sel.id,action:act,editor_note:note||undefined});
      toast('success','Done',{approve:'Article approved.',reject:'Rejected.',publish:'Published!'}[act]||act);
      setNote('');refresh();
      const r=await api('GET',`/api/articles/${sel.id}`);setFull(r);
    }catch(e){toast('error','Failed',e.message);}
    setLoading('');
  };
  const doRetrans = async lc => {
    setLoading('rt');
    try{await api('POST',`/api/articles/${sel.id}/action`,{article_id:sel.id,action:'request_retranslation',language_code:lc});
      toast('info','Retranslating','Fresh translation requested.');
      setTimeout(async()=>{const r=await api('GET',`/api/articles/${sel.id}`);setFull(r);},4000);
    }catch(e){toast('error','Failed',e.message);}
    setLoading('');
  };
  const doEdit = async()=>{
    const t=full.translations.find(t=>t.language_code===actLang);
    if(!t)return;
    setLoading('edit');
    try{await api('POST',`/api/articles/${sel.id}/action`,{article_id:sel.id,action:'edit',language_code:actLang,modified_content:editTxt});
      toast('success','Saved','Translation updated.');setEditMode(false);
      const r=await api('GET',`/api/articles/${sel.id}`);setFull(r);
    }catch(e){toast('error','Failed',e.message);}
    setLoading('');
  };
  const doTone = async()=>{
    setLoading('tone');
    try{const r=await api('GET',`/api/articles/${sel.id}/tone-check?language_code=${actLang||'en'}`);setTone(r.analysis);}
    catch(e){toast('error','Failed',e.message);}
    setLoading('');
  };
  const doSummary = async()=>{
    setLoading('sum');
    try{const r=await api('GET',`/api/articles/${sel.id}/summary`);setSummary(r.summary);}
    catch(e){toast('error','Failed',e.message);}
    setLoading('');
  };

  const article = full||sel;
  const trans = article?.translations||[];
  const activeTrans = actLang?trans.find(t=>t.language_code===actLang):trans[0];
  const getEv = id=>events.find(e=>e.article_id===id);
  const filtered = (articles||[]).filter(a=>{
    const ms=!search||a.title.toLowerCase().includes(search.toLowerCase())||a.id.includes(search.toUpperCase());
    const mf=!filter||a.status===filter;
    return ms&&mf;
  });
  const SEVBG={safe:'rgba(16,185,129,.06)',low:'rgba(132,204,22,.06)',medium:'rgba(245,158,11,.06)',high:'rgba(249,115,22,.06)',critical:'rgba(239,68,68,.06)'};
  const SEVBRD={safe:'rgba(16,185,129,.2)',low:'rgba(132,204,22,.2)',medium:'rgba(245,158,11,.2)',high:'rgba(249,115,22,.2)',critical:'rgba(239,68,68,.2)'};

  return (
    <div style={{display:'grid',gridTemplateColumns:'340px 1fr',gap:14,height:'calc(100vh - 90px)'}}>
      <div className="card" style={{display:'flex',flexDirection:'column',overflow:'hidden',padding:'12px'}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:9}}>Review Queue ({filtered.length})</div>
        <div className="sbar"><span>🔍</span><input placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:10}}>
          {['','review','processing','approved','published','rejected'].map(s=>(
            <button key={s} onClick={()=>setFilter(s)} style={{padding:'3px 9px',borderRadius:20,fontSize:11,cursor:'pointer',background:filter===s?'var(--blue)':'var(--bg-elevated)',color:filter===s?'#fff':'var(--text-muted)',border:`1px solid ${filter===s?'var(--blue)':'var(--border)'}`}}>
              {s||'All'}
            </button>
          ))}
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {filtered.length===0&&<div className="empty"><div className="empty-ico">📋</div><p>No articles match.</p></div>}
          {filtered.map(a=>{
            const ev=getEv(a.id);
            return (
              <div key={a.id} className={`art-item${sel?.id===a.id?' sel':''}`} onClick={()=>loadFull(a)}>
                <div className="aih">
                  <span className="aid">#{a.id}</span>
                  <span className={`badge b-${a.status}`}>{a.status}</span>
                  {a.sensitivity&&<span className={`badge sev-${a.sensitivity.overall_level}`}>{a.sensitivity.overall_level}</span>}
                  {a.priority==='breaking'&&<span style={{fontSize:9,color:'var(--red)',fontWeight:700}}>⚡</span>}
                </div>
                <div className="at">{a.title}</div>
                <div className="am"><span>{a.source}</span><span>{(a.translations||[]).length} langs</span><span>{new Date(a.created_at).toLocaleTimeString()}</span></div>
                {ev&&<div className="lp"><div className="pulse"/>{ev.event==='translation_done'?`${ev.language} done`:ev.event==='ready_for_review'?'Ready for review!':'Processing...'}</div>}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{overflowY:'auto'}}>
        {!article?(
          <div className="card" style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div className="empty"><div className="empty-ico">◈</div><p>Select an article to review.</p></div>
          </div>
        ):(
          <div>
            <div className="card" style={{marginBottom:12}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7,flexWrap:'wrap'}}>
                <span className="aid">#{article.id}</span>
                <span className={`badge b-${article.status}`}>{article.status.toUpperCase()}</span>
                {article.sensitivity&&<span className={`badge sev-${article.sensitivity.overall_level}`}>{article.sensitivity.overall_level.toUpperCase()} SENSITIVITY</span>}
                {article.priority==='breaking'&&<span style={{fontSize:11,color:'var(--red)',fontWeight:700,animation:'sh 1s infinite'}}>⚡ BREAKING</span>}
              </div>
              <h2 style={{fontSize:17,fontWeight:700,lineHeight:1.4,marginBottom:6}}>{article.title}</h2>
              <div style={{fontSize:12,color:'var(--text-muted)',display:'flex',gap:14,flexWrap:'wrap',marginBottom:10}}>
                <span>📰 {article.source}</span><span>🏷 {article.category}</span>
                <span>🌐 {trans.length} translations</span>
                <span>🕐 {new Date(article.created_at).toLocaleString()}</span>
              </div>
              <div style={{background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:12,fontSize:13,color:'var(--text-secondary)',lineHeight:1.7,maxHeight:130,overflowY:'auto',marginBottom:10}}>
                {article.content}
              </div>
              <input className="fi" placeholder="Editor note (optional)..." value={note} onChange={e=>setNote(e.target.value)} style={{marginBottom:10}}/>
              <button className="btn bg" style={{fontSize:12,padding:'5px 10px',marginBottom:8}} onClick={doSummary} disabled={loading==='sum'}>
                {loading==='sum'?'...':'≡ Generate Summary'}
              </button>
              {summary&&<div className="alert-i">{summary}</div>}
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
                {article.status==='review'&&<>
                  <button className="btn bs" onClick={()=>doAction('approve')} disabled={!!loading}>{loading==='approve'?'...':'✓ Approve'}</button>
                  <button className="btn bd" onClick={()=>doAction('reject')} disabled={!!loading}>{loading==='reject'?'...':'✕ Reject'}</button>
                </>}
                {article.status==='approved'&&<button className="btn bp" onClick={()=>doAction('publish')} disabled={!!loading}>{loading==='publish'?'...':'▲ Publish'}</button>}
                {article.status==='rejected'&&<button className="btn bg" onClick={()=>doAction('approve')} disabled={!!loading}>↩ Reinstate</button>}
                <button className="btn bc" style={{fontSize:11,padding:'5px 9px'}} onClick={()=>loadFull(sel)}>↻ Refresh</button>
              </div>
            </div>

            <div className="card">
              <div className="tabs">
                <button className={`tab${tab==='sensitivity'?' active':''}`} onClick={()=>setTab('sensitivity')}>⚑ Sensitivity {article.sensitivity?.flags?.length>0&&`(${article.sensitivity.flags.length})`}</button>
                <button className={`tab${tab==='translations'?' active':''}`} onClick={()=>setTab('translations')}>🌐 Translations ({trans.length})</button>
                <button className={`tab${tab==='notes'?' active':''}`} onClick={()=>setTab('notes')}>📝 Notes {article.editor_notes?.length>0&&`(${article.editor_notes.length})`}</button>
              </div>

              {tab==='sensitivity'&&(
                article.sensitivity?(
                  <div>
                    <div className="sens-box" style={{background:SEVBG[article.sensitivity.overall_level],borderColor:SEVBRD[article.sensitivity.overall_level]}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
                        <div style={{display:'flex',gap:9,alignItems:'center'}}>
                          <span className={`badge sev-${article.sensitivity.overall_level}`} style={{fontSize:12,padding:'4px 12px'}}>{article.sensitivity.overall_level.toUpperCase()}</span>
                          <strong>Sensitivity Level</strong>
                        </div>
                        <span style={{fontSize:13,fontWeight:600,color:article.sensitivity.safe_to_publish?'var(--green)':'var(--red)'}}>
                          {article.sensitivity.safe_to_publish?'✓ Safe to Publish':'✗ Requires Review'}
                        </span>
                      </div>
                      <p style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.5}}>{article.sensitivity.recommendation}</p>
                    </div>
                    {(article.sensitivity.flags||[]).map((f,i)=>(
                      <div key={i} className="flag-it">
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                          <span className={`badge sev-${f.severity}`}>{f.severity}</span>
                          <strong style={{fontSize:12}}>{f.category}</strong>
                        </div>
                        <p style={{fontSize:12,color:'var(--text-secondary)',lineHeight:1.5}}>{f.description}</p>
                        {f.flagged_text&&<div style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic',marginTop:4,background:'rgba(0,0,0,.2)',padding:'3px 7px',borderRadius:4}}>"{f.flagged_text}"</div>}
                      </div>
                    ))}
                    {(article.sensitivity.flags||[]).length===0&&<div className="alert-s">No specific flags raised. Article appears suitable for publication.</div>}
                  </div>
                ):<div className="empty"><p>Sensitivity analysis pending...</p></div>
              )}

              {tab==='translations'&&(
                trans.length===0?(
                  <div className="empty"><div className="empty-ico">⏳</div><p>Translations being generated...</p></div>
                ):(
                  <div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:14}}>
                      {trans.map(t=>(
                        <button key={t.language_code}
                          onClick={()=>{setActLang(t.language_code);setEditMode(false);setTone(null);}}
                          style={{padding:'5px 12px',borderRadius:20,border:`1px solid ${(actLang||trans[0]?.language_code)===t.language_code?'var(--blue)':'var(--border)'}`,background:(actLang||trans[0]?.language_code)===t.language_code?'rgba(59,130,246,.1)':'var(--bg-elevated)',color:(actLang||trans[0]?.language_code)===t.language_code?'var(--text-primary)':'var(--text-muted)',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
                          <div style={{width:5,height:5,borderRadius:'50%',background:t.status==='editor_revised'?'var(--cyan)':t.status==='approved'?'var(--green)':'var(--yellow)'}}/>
                          {t.language_name} <span style={{fontSize:10,color:'var(--text-muted)'}}>{Math.round(t.tone_score*100)}%</span>
                        </button>
                      ))}
                    </div>
                    {activeTrans&&(
                      <div style={{background:'var(--bg-elevated)',borderRadius:8,padding:14}}>
                        <h3 style={{fontSize:14,fontWeight:600,marginBottom:10}}>{activeTrans.translated_title}</h3>
                        {editMode?(
                          <textarea className="ta" rows={7} value={editTxt} onChange={e=>setEditTxt(e.target.value)} style={{marginBottom:8}}/>
                        ):(
                          <p style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.8,whiteSpace:'pre-wrap'}}>{activeTrans.translated_content}</p>
                        )}
                        {(activeTrans.cultural_adaptations||[]).length>0&&(
                          <div style={{marginTop:12}}>
                            <div style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:5}}>Cultural Adaptations ({activeTrans.cultural_adaptations.length})</div>
                            {activeTrans.cultural_adaptations.map((a,i)=>(
                              <div key={i} style={{fontSize:12,color:'var(--text-secondary)',padding:'3px 0',borderBottom:'1px solid var(--border)',display:'flex',gap:6}}>
                                <span style={{color:'var(--cyan)'}}>→</span>{a}
                              </div>
                            ))}
                          </div>
                        )}
                        <div style={{display:'flex',alignItems:'center',gap:8,marginTop:10}}>
                          <span style={{fontSize:11,color:'var(--text-muted)',minWidth:75}}>Tone Score</span>
                          <div className="bar-track"><div className="bar-fill" style={{width:`${activeTrans.tone_score*100}%`,background:'linear-gradient(90deg,var(--blue),var(--green))'}}/></div>
                          <span style={{fontSize:12,color:'var(--text-secondary)',minWidth:35}}>{Math.round(activeTrans.tone_score*100)}%</span>
                        </div>
                        <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
                          {editMode?(
                            <><button className="btn bs" style={{fontSize:11,padding:'5px 10px'}} onClick={doEdit} disabled={loading==='edit'}>{loading==='edit'?'...':'✓ Save'}</button>
                            <button className="btn bg" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>setEditMode(false)}>Cancel</button></>
                          ):(
                            <button className="btn bg" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>{setEditMode(true);setEditTxt(activeTrans.translated_content);}}>✎ Edit</button>
                          )}
                          <button className="btn bg" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>doRetrans(activeTrans.language_code)} disabled={loading==='rt'}>{loading==='rt'?'...':'↻ Retranslate'}</button>
                          <button className="btn bg" style={{fontSize:11,padding:'5px 10px'}} onClick={doTone} disabled={loading==='tone'}>{loading==='tone'?'...':'◎ Tone Check'}</button>
                        </div>
                        {tone&&(
                          <div style={{marginTop:10,background:'var(--bg-card)',borderRadius:6,padding:10,border:'1px solid var(--border)'}}>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:6}}>
                              <strong>Tone Analysis</strong>
                              <span style={{color:tone.is_broadcast_ready?'var(--green)':'var(--red)'}}>{tone.is_broadcast_ready?'✓ Broadcast Ready':'✗ Needs Revision'}</span>
                            </div>
                            {(tone.suggestions||[]).map((s,i)=><div key={i} style={{fontSize:12,color:'var(--text-muted)',padding:'2px 0'}}>• {s}</div>)}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )
              )}

              {tab==='notes'&&(
                <div>
                  {(!article.editor_notes||article.editor_notes.length===0)?(
                    <div className="empty">No editor notes yet.</div>
                  ):(
                    article.editor_notes.map((n,i)=>(
                      <div key={i} style={{padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
                        <span style={{color:'var(--blue)',fontWeight:600}}>{n.action}</span>
                        <span style={{color:'var(--text-muted)',marginLeft:8}}>{n.note}</span>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Published ──
function Published({articles}) {
  const pub=(articles||[]).filter(a=>a.status==='published');
  const [sel,setSel]=useState(null);
  const [modalArt,setModalArt]=useState(null);
  const [isPlaying,setIsPlaying]=useState(false);
  const [playLang,setPlayLang]=useState('en');

  // Self-contained voice maps (no dependency on Broadcast Studio constants)
  const PUB_RV={'hi':'Hindi Female','ta':'Tamil Female','te':'Telugu Female','bn':'Bengali Female',
    'mr':'Marathi Female','gu':'Gujarati Female','kn':'Kannada Female','ml':'Malayalam Female',
    'pa':'Punjabi Female','fr':'French Female','es':'Spanish Female','ar':'Arabic Female','en':'UK English Female'};
  const PUB_LC={'hi':'hi-IN','ta':'ta-IN','te':'te-IN','bn':'bn-IN','mr':'mr-IN','gu':'gu-IN',
    'kn':'kn-IN','ml':'ml-IN','pa':'pa-IN','fr':'fr-FR','es':'es-ES','ar':'ar-SA','en':'en-US'};

  const doPlayArt=(art,lang)=>{
    try{window.speechSynthesis.cancel();}catch(e){}
    try{if(window.responsiveVoice)window.responsiveVoice.cancel();}catch(e){}
    const trans=(art.translations||[]).find(t=>t.language_code===lang);
    const raw=trans
      ?((trans.translated_title||art.title)+'. '+(trans.translated_content||art.content))
      :('Breaking news. '+art.title+'. '+art.content);
    const txt=raw.slice(0,500);
    setIsPlaying(true);
    try{
      // Web Speech API first — local, instant, no network delay
      const voices=window.speechSynthesis.getVoices();
      const lc=PUB_LC[lang]||'en-US';
      const lp=lc.split('-')[0];
      const speak=(vlist)=>{
        const utt=new SpeechSynthesisUtterance(txt);
        utt.lang=lc; utt.rate=0.9; utt.volume=1;
        const v=vlist.find(x=>x.lang===lc)||vlist.find(x=>x.lang.startsWith(lp));
        if(v)utt.voice=v;
        utt.onend=()=>setIsPlaying(false);
        utt.onerror=()=>{
          // WSA failed — try ResponsiveVoice as fallback
          if(window.responsiveVoice){
            window.responsiveVoice.speak(txt,PUB_RV[lang]||'UK English Female',
              {rate:0.9,pitch:1,volume:1,onend:()=>setIsPlaying(false),onerror:()=>setIsPlaying(false)});
          } else { setIsPlaying(false); }
        };
        window.speechSynthesis.speak(utt);
      };
      if(voices.length>0){
        speak(voices);
      } else {
        // Voices not loaded yet — short wait then speak
        const t=Date.now();
        const poll=setInterval(()=>{
          const v=window.speechSynthesis.getVoices();
          if(v.length>0||Date.now()-t>800){clearInterval(poll);speak(v);}
        },80);
      }
    }catch(e){setIsPlaying(false);}
  };

  const openModal=(art)=>{
    const lng=art.translations?.length>0?art.translations[0].language_code:'en';
    setModalArt(art);setIsPlaying(false);setPlayLang(lng);
    doPlayArt(art,lng);   // play immediately — user gesture is active
  };
  const closeModal=()=>{
    try{window.speechSynthesis.cancel();}catch(e){}
    try{if(window.responsiveVoice)window.responsiveVoice.cancel();}catch(e){}
    setModalArt(null);setIsPlaying(false);
  };
  if(pub.length===0) return (
    <div><h1 style={{fontSize:19,fontWeight:700,marginBottom:16}}>Published Articles</h1>
      <div className="card" style={{padding:48}}><div className="empty"><div className="empty-ico">📡</div><p>No published articles yet.<br/>Approve articles in the Review Queue, then publish.</p></div></div>
    </div>
  );
  return (
    <>
    {modalArt&&(
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={closeModal}>
        <div style={{background:'#000',borderRadius:14,overflow:'hidden',width:620,maxWidth:'92vw',border:'2px solid #1a2840',boxShadow:'0 0 80px rgba(0,0,0,.8)'}} onClick={e=>e.stopPropagation()}>
          <div style={{background:'linear-gradient(135deg,#0a1628,#0d1f3c)',padding:'10px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'2px solid #ef4444'}}>
            <div style={{fontSize:16,fontWeight:900,letterSpacing:2,color:'white'}}>🌐 WORLD NEWS 24</div>
            <div style={{display:'flex',alignItems:'center',gap:6,background:'#ef4444',padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:700,color:'white',letterSpacing:1}}>
              <div style={{width:6,height:6,borderRadius:'50%',background:'white',animation:'pulse 1.5s ease-in-out infinite'}}/>LIVE
            </div>
          </div>
          {modalArt.priority==='breaking'&&(
            <div style={{background:'linear-gradient(90deg,#ef4444,#b91c1c)',padding:'5px 18px',fontSize:11,fontWeight:800,color:'white',letterSpacing:1,display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:6,height:6,borderRadius:'50%',background:'white',animation:'pulse 1.5s ease-in-out infinite'}}/>
              BREAKING NEWS &nbsp;•&nbsp; {(modalArt.category||'').toUpperCase()}
            </div>
          )}
          <div style={{background:'radial-gradient(ellipse at center,#0d2540 0%,#050d1a 100%)',padding:28,minHeight:260,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',position:'relative'}}>
            <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0px,rgba(0,0,0,.04) 1px,transparent 1px,transparent 3px)',pointerEvents:'none'}}/>
            <div style={{position:'relative',zIndex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
              <div style={{fontSize:68,transition:'filter .3s',filter:'drop-shadow(0 0 '+(isPlaying?'32':'10')+'px rgba(6,182,212,'+(isPlaying?.65:.2)+')',animation:isPlaying?'avatarPulse .5s ease infinite alternate':'none'}}>🎙</div>
              <div style={{display:'flex',gap:4,alignItems:'flex-end',height:28}}>
                {[.3,.5,.4,.6,.35,.45,.38,.52,.3].map((d,i)=>(
                  <div key={i} style={{width:5,background:'var(--cyan)',borderRadius:3,minHeight:5,animation:isPlaying?'audioBar '+d+'s ease infinite alternate':'none',height:isPlaying?undefined:5,animationDelay:i*.06+'s'}}/>
                ))}
              </div>
              <div style={{fontSize:10,color:isPlaying?'rgba(6,182,212,.9)':'rgba(255,255,255,.4)',fontWeight:700,letterSpacing:1.5,textTransform:'uppercase'}}>
                {isPlaying?'● AI VIDEO GENERATING — LIVE BROADCAST':'AI NEWS PRESENTER READY'}
              </div>
              <div style={{fontSize:13,color:'rgba(255,255,255,.75)',fontStyle:'italic',maxWidth:480,textAlign:'center',lineHeight:1.8}}>{(modalArt.content||'').slice(0,180)}...</div>
            </div>
            <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'8px 16px',background:'rgba(0,0,0,.88)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:'white',display:'flex',alignItems:'center',gap:6}}><div style={{width:3,height:14,background:'#3b82f6',borderRadius:2}}/>AI Newsroom Correspondent<span style={{fontSize:9,background:'#3b82f6',padding:'1px 6px',borderRadius:4,marginLeft:4}}>{modalArt.category}</span></div>
                <div style={{fontSize:10,color:'rgba(255,255,255,.5)'}}>Byte Break Team | Cognizant CODEX Hackathon 2025</div>
              </div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {(modalArt.translations||[]).slice(0,5).map(t=>(
                  <span key={t.language_code} style={{fontSize:9,padding:'2px 6px',borderRadius:10,background:'rgba(59,130,246,.2)',color:'rgba(255,255,255,.7)',border:'1px solid rgba(59,130,246,.3)'}}>{t.language_name}</span>
                ))}
              </div>
            </div>
